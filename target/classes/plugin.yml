name: KillStatistics
version: 1.0.4
main: dev.mememc.killstatistics.KillStatisticsPlugin
api-version: '1.21'
author: MemeMC
description: Kill statistics with anti-farm limits and PlaceholderAPI support.
softdepend:
  - PlaceholderAPI
  - BetterTeams
commands:
  kills:
    description: Shows player, team, or specific team-member kill leaderboards.
    usage: /kills | /kills team | /kills team <team>
  killstats:
    description: Admin command for kill statistics resets.
    usage: /killstats resetall | /killstats reset <player|team> | /killstats resetteam <team> | /killstats addkills <player|team> <amount> | /killstats removekills <player|team> <amount> | /killstats ownercmd <alias>
    permission: killstatistics.admin
  credits:
    description: Shows plugin credits.
    usage: /credits
permissions:
  killstatistics.admin:
    description: Allows resetting kill statistics data.
    default: op
